name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'src/main/java/**'
      - 'build.gradle'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # the API reference is generated from the source, so the site is always current
      - name: Build the Javadoc
        run: |
          chmod +x gradlew
          ./gradlew javadoc

      - name: Put the Javadoc in the site
        run: |
          mkdir -p doc/api
          cp -r build/docs/javadoc/. doc/api/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc

      - id: deployment
        uses: actions/deploy-pages@v4
