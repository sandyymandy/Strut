# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Fabric
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
fabric_version=0.116.12+1.21.1

# Version ranges, written into fabric.mod.json
minecraft_version_range=>=1.21
loader_version_range=>=0.17
fabric_version_range=>=0.100.0+1.21

# Mod
mod_id=strut
mod_version=1.0.0
maven_group=com.sandymandy.strut
mod_display_name=Strut
mod_authors=SandyMandy
mod_license=MIT
mod_description=Strut is a mesh and animation engine for Minecraft mods, adding free-form mesh rendering, armature skinning and deformation on top of keyframe-based bone animation. Forked from GeckoLib.

# Dependencies
mixinextras_version=0.5.3
junit_version=5.11.4

# Optional - Iris is a soft runtime dependency. Pinned to the 1.8.8 release build; IrisCompat's own minor-API-revision check is what gates behaviour at
# runtime, so this only has to match closely enough to compile against
iris_version=1.8.8+1.21.1-fabric

# Java
java_version=21
