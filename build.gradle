plugins {
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'java'
	id 'idea'
	id 'eclipse'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

	withSourcesJar()
	withJavadocJar()
}

repositories {
	mavenCentral()

	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"

	// Iris is a genuinely optional runtime
	// dependency - the mod must work with it absent - so this is compile-only, never modImplementation.
	// Every reference to an Iris class is behind a FabricLoader.isModLoaded("iris") check, isolated in
	// its own class (IrisApiAccess) so the JVM never resolves IrisApi unless Iris is actually present
	modCompileOnly "maven.modrinth:iris:${project.iris_version}"

	// Physics: the options screens are optional integrations, compiled against and never required. Their classes are reached only
	// when the mod is loaded (the modmenu entrypoint is only asked for by Mod Menu; Cloth Config is checked with isModLoaded)
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
	modCompileOnly "com.terraformersmc:modmenu:11.0.4"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
 }

processResources {
	def expansions = [
			version                 : project.version,
			mod_id                  : project.mod_id,
			mod_display_name        : project.mod_display_name,
			mod_authors             : project.mod_authors,
			mod_license             : project.mod_license,
			mod_description         : project.mod_description,
			minecraft_version       : project.minecraft_version,
			minecraft_version_range : project.minecraft_version_range,
			fabric_loader_version   : project.loader_version,
			fabric_loader_version_range: project.loader_version_range,
			fabric_api_version      : project.fabric_version,
			fabric_api_version_range: project.fabric_version_range
	]

	inputs.properties expansions

	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand expansions
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = project.java_version as int
}

// A {@link} that points nowhere fails the javadoc build: the Mojang-mapped targets the Yarn remap left behind are gone. Only references are
// checked; missing @param/@return text is not.
tasks.withType(Javadoc).configureEach {
	options.addStringOption('Xdoclint:reference', '-quiet')
	options.addBooleanOption('Xwerror', false)
	failOnError = true
}

tasks.withType(Jar).configureEach {
	manifest {
		attributes([
				'Specification-Title'   : project.mod_display_name,
				'Specification-Vendor'  : project.mod_authors,
				'Specification-Version' : project.version,
				'Implementation-Title'  : project.mod_display_name,
				'Implementation-Version': project.version,
				'Implementation-Vendor' : project.mod_authors,
				'Built-On-Minecraft'    : project.minecraft_version,
				'MixinConfigs'          : "${project.mod_id}.mixins.json"
		])
	}
}

test {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false

	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

publishing {
	publications {
		create('mod', MavenPublication) {
			artifactId = base.archivesName.get()

			from components.java
		}
	}

	repositories {
		mavenLocal()
	}
}
